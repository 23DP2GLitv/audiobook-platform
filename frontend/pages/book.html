<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioBooks</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/player.css">
  <style>
    .book-hero {
      background: linear-gradient(180deg, rgba(245,158,11,0.05) 0%, transparent 100%);
      padding: 48px 0;
    }
    .book-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 48px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .book-layout { grid-template-columns: 1fr; }
      .book-cover-wrap { max-width: 200px; margin: 0 auto; }
    }
    .book-cover-wrap {
      align-self: start;
    }
    .book-cover-img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .book-cover-placeholder-lg {
      width: 100%;
      aspect-ratio: 2/3;
      background: linear-gradient(135deg, var(--bg-elevated), var(--bg-hover));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
    }
    .book-title-main {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin-bottom: 8px;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .book-author-link {
      font-size: 1rem;
      color: var(--amber);
      font-weight: 500;
      margin-bottom: 16px;
      display: inline-block;
    }
    .book-author-link:hover { color: var(--amber-light); }
    .book-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .book-description {
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 32px;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .book-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    /* Parts list */
    .parts-list { display: flex; flex-direction: column; gap: 8px; }
    .part-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition);
      min-width: 0;
    }
    .part-item:hover { border-color: var(--border-amber); background: var(--bg-elevated); }
    .part-item.current { border-color: var(--amber); background: var(--amber-glow2); }
    .part-num {
      width: 28px; height: 28px;
      background: var(--bg-elevated);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .part-item.current .part-num { background: var(--amber); color: #000; }
    .part-info { flex: 1; min-width: 0; overflow: hidden; }
    .part-title-text {
      font-size: 0.9rem; font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .part-duration { font-size: 0.75rem; color: var(--text-muted); }
    /* Reviews */
    .review-item {
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }
    .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .review-stars { color: var(--amber); font-size: 0.85rem; }
    .review-date { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }
    .review-text { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
    /* Progress indicator */
    .listening-progress {
      background: var(--amber-glow2);
      border: 1px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 24px;
      display: none;
    }
    .listening-progress.visible { display: block; }
  </style>
</head>
<body>
  <div class="main-content">
    <div id="loading-state" class="loading-block" style="min-height:60vh">
      <div class="spinner"></div>
    </div>
    <div id="book-content" style="display:none">
      <div class="book-hero">
        <div class="container">
          <div class="book-layout">
            <div class="book-cover-wrap">
              <img id="book-cover" class="book-cover-img" src="" alt="" style="display:none" onerror="this.style.display='none';document.getElementById('book-cover-placeholder').style.display='flex'">
              <div id="book-cover-placeholder" class="book-cover-placeholder-lg" style="display:none">📚</div>
            </div>
            <div>
              <h1 class="book-title-main" id="book-title"></h1>
              <a id="book-author-link" class="book-author-link" href="#"></a>
              <div class="book-meta-row" id="book-meta"></div>
              <div class="book-description" id="book-description"></div>
              <div class="book-actions" id="book-actions"></div>
              <!-- Parts -->
              <div id="parts-section">
                <h3 style="margin-bottom:16px;font-size:1rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px" data-i18n="parts">Daļas</h3>
                <div class="parts-list" id="parts-list"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Reviews section -->
      <div class="container" style="padding-bottom:60px">
        <div class="divider"></div>
        <div style="display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:start" id="reviews-layout">
          <div>
            <div class="section-header">
              <h2 class="section-title" data-i18n="reviews">Atsauksmes</h2>
              <span id="reviews-count" class="badge badge-gray"></span>
            </div>
            <div id="reviews-list"></div>
            <div id="reviews-pagination" class="pagination"></div>
          </div>
          <div id="review-form-wrap">
            <div class="card" style="padding:24px" id="review-form-card">
              <h3 style="margin-bottom:20px;font-size:1.1rem" data-i18n="write_review">Rakstīt Atsauksmi</h3>
              <div id="review-form-content"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/confirm-modal.js"></script>
  <script>
    const bookId = new URLSearchParams(window.location.search).get('id');
    let bookData = null;
    let reviewPage = 1;

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '';
      const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
      return h > 0
        ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
    }

    async function loadBook() {
      if (!bookId) { window.location.href = 'catalog.html'; return; }
      try {
        const { book } = await api.books.get(bookId);
        bookData = book;
        document.title = `${book.title} — AudioBooks`;
        renderBook(book);
        loadReviews();
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('book-content').style.display = 'block';
      } catch (e) {
        document.getElementById('loading-state').innerHTML =
          `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>${e.message}</h3></div>`;
      }
    }

    function renderBook(book) {
      // Cover
      const coverEl = document.getElementById('book-cover');
      const placeholderEl = document.getElementById('book-cover-placeholder');
      if (book.cover_url) {
        coverEl.src = book.cover_url;
        coverEl.style.display = 'block';
        placeholderEl.style.display = 'none';
      } else {
        coverEl.style.display = 'none';
        placeholderEl.style.display = 'flex';
      }

      document.getElementById('book-title').textContent = book.title;
      const authorLink = document.getElementById('book-author-link');
      authorLink.textContent = book.author_name || '';
      authorLink.href = `author.html?id=${book.author_id}`;

      // Meta badges — все жанры
      const lang = i18n.current;
      const meta = [];
      if (book.rating > 0) meta.push(`<span class="badge badge-amber">⭐ ${parseFloat(book.rating).toFixed(1)}</span>`);
      if (book.review_count) meta.push(`<span class="badge badge-gray">💬 ${book.review_count}</span>`);
      if (book.duration_sec) meta.push(`<span class="badge badge-gray">⏱ ${formatTime(book.duration_sec)}</span>`);

      // Первичный жанр
      if (book['genre_'+lang]) meta.push(`<span class="badge badge-gray">${book['genre_'+lang]}</span>`);
      // Дополнительные жанры из audiobook_genres
      if (book.genres?.length) {
        book.genres.forEach(g => {
          if (g.id !== book.genre_id) { // не дублируем основной
            meta.push(`<span class="badge badge-gray">${g['name_'+lang] || g.name_en}</span>`);
          }
        });
      }
      if (book.lang_code) meta.push(`<span class="badge badge-blue">${book.lang_code.toUpperCase()}</span>`);
      document.getElementById('book-meta').innerHTML = meta.join('');

      // Description
      const descEl = document.getElementById('book-description');
      descEl.style.whiteSpace = 'pre-wrap';
      descEl.style.wordBreak  = 'break-word';
      descEl.textContent = book.description || '';

      // Actions
      const isOwner = api.getUser()?.id === book.author_id;
      const totalProgress = book.user_progress?.progress_sec || 0;
      const startPart = Math.max(0, book.parts?.findIndex(p => p.id === book.user_progress?.file_id) ?? 0);
      let elapsedBefore = 0;
      for (let i = 0; i < startPart; i++) elapsedBefore += (book.parts[i]?.duration_sec || 0);
      const startSec = Math.max(0, totalProgress - elapsedBefore);

      // Play/Pause кнопка
      let actions = `
        <button class="btn btn-primary btn-lg" id="book-play-btn" onclick="togglePlay(${startPart}, ${startSec})">
          <span id="book-play-icon">▶</span>
          <span id="book-play-label">${t(totalProgress > 0 ? 'continue_listening' : 'listen')}</span>
        </button>`;

      if (api.isLoggedIn()) {
        actions += `<a href="${api.books.download(book.id)}" class="btn btn-secondary" download>⬇ ${t('download')}</a>`;
      }
      if (isOwner || api.isMod()) {
        actions += `<a href="edit-book.html?id=${book.id}" class="btn btn-secondary">✏️ ${t('edit')}</a>`;
        actions += `<button class="btn btn-danger btn-sm" onclick="deleteBook()">🗑 ${t('delete')}</button>`;
      }
      document.getElementById('book-actions').innerHTML = actions;

      // Sync play button with player state
      syncPlayBtn();

      // Parts
      if (book.parts?.length) {
        document.getElementById('parts-list').innerHTML = book.parts.map((p, i) => {
          let partOffset = 0;
          if (i === startPart && totalProgress > 0) partOffset = startSec;
          return `
          <div class="part-item"
               onclick="playBook(${i}, ${i === startPart ? partOffset : 0})">
            <div class="part-num">${p.part_number}</div>
            <div class="part-info">
              <div class="part-title-text">${p.part_title || t('player_part') + ' ' + p.part_number}</div>
              ${p.duration_sec ? `<div class="part-duration">⏱ ${formatTime(p.duration_sec)}</div>` : ''}
            </div>
            <span style="color:var(--text-muted);font-size:0.85rem">▶</span>
          </div>`;
        }).join('');
        // Применяем выделение активной главы после рендера
        syncActivePart();
      } else {
        document.getElementById('parts-section').style.display = 'none';
      }

      // Review form
      renderReviewForm(book.user_review);
    }

    function togglePlay(partIdx = 0, startSec = 0) {
      if (!bookData?.parts?.length) { showToast(t('not_found'), 'error'); return; }
      const state = Player.getState();
      const isThisBook = state.book?.id === bookData.id;

      if (isThisBook && !state.paused) {
        // Пауза
        Player.audio.pause();
      } else if (isThisBook && state.paused) {
        // Продолжить
        Player.audio.play();
      } else {
        // Новая книга
        Player.play(bookData, bookData.parts, partIdx, startSec);
      }
      setTimeout(syncPlayBtn, 100);
    }

    function playBook(partIdx = 0, startSec = 0) {
      if (!bookData?.parts?.length) return;
      Player.play(bookData, bookData.parts, partIdx, startSec);
      setTimeout(syncPlayBtn, 100);
    }

    function syncPlayBtn() {
      const icon  = document.getElementById('book-play-icon');
      const label = document.getElementById('book-play-label');
      if (!icon || !label) return;
      const state = Player.getState();
      const isThisBook = state.book?.id === bookData?.id;
      if (isThisBook && !state.paused) {
        icon.textContent  = '⏸';
        label.textContent = t('player_now_playing') || 'Playing...';
      } else {
        icon.textContent  = '▶';
        const prog = bookData?.user_progress?.progress_sec || 0;
        label.textContent = t(prog > 0 ? 'continue_listening' : 'listen');
      }
      // Обновляем выделение активной главы
      syncActivePart();
    }

    function syncActivePart() {
      const state = Player.getState();
      const isThisBook = state.book?.id === bookData?.id;
      let activePart = -1;
      if (isThisBook) {
        activePart = state.part ?? -1;
      } else if (bookData?.user_progress?.file_id) {
        // Если плеер не играет — выделяем главу из сохранённого прогресса
        activePart = bookData.parts?.findIndex(p => p.id === bookData.user_progress.file_id) ?? -1;
      }
      document.querySelectorAll('.part-item').forEach((el, i) => {
        el.classList.toggle('current', i === activePart);
      });
    }

    // Обновляем кнопку и главу когда плеер меняет состояние
    Player.audio.addEventListener('play',  syncPlayBtn);
    Player.audio.addEventListener('pause', syncPlayBtn);

    // Следим за сменой части через timeupdate (дёшево — раз в секунду)
    let _lastPart = -1;
    Player.audio.addEventListener('timeupdate', () => {
      const state = Player.getState();
      if (state.book?.id === bookData?.id && state.part !== _lastPart) {
        _lastPart = state.part;
        syncActivePart();
        syncPlayBtn();
      }
    });

    async function downloadBook() {
      // Track download
      try {
        await api.request('POST', `/books/${bookId}/download`);
      } catch {}
      // Open first audio file
      if (bookData?.parts?.[0]) {
        const url = api.books.streamUrl(bookId, bookData.parts[0].id);
        window.open(url, '_blank');
      }
    }

    async function deleteBook() {
      const ok = await confirmModal({
        title: t('confirm_delete'),
        text: 'Grāmata tiks dzēsta. Šo darbību nevar atcelt.',
        icon: '🗑️',
      });
      if (!ok) return;
      try {
        await api.books.delete(bookId);
        showToast('Book deleted', 'success');
        setTimeout(() => { window.location.href = 'my-books.html'; }, 1000);
      } catch (e) { showToast(e.message, 'error'); }
    }

    // ── Reviews ──────────────────────────────────────────
    async function loadReviews() {
      try {
        const { reviews, pagination } = await api.reviews.list(bookId, { page: reviewPage, limit: 10 });
        const el = document.getElementById('reviews-list');

        document.getElementById('reviews-count').textContent = pagination.total;

        if (!reviews.length && reviewPage === 1) {
          el.innerHTML = `<p class="text-muted" style="padding:20px 0">${t('no_reviews')}</p>`;
          return;
        }

        el.innerHTML = reviews.map(r => `
          <div class="review-item">
            <div class="review-header">
              <div class="avatar-placeholder" style="width:32px;height:32px;font-size:0.8rem">${(r.username||'?')[0].toUpperCase()}</div>
              <div>
                <div style="font-size:0.9rem;font-weight:600">${r.username}</div>
                <div class="review-stars">${'⭐'.repeat(r.rating)}</div>
              </div>
              <span class="review-date">${new Date(r.created_at).toLocaleDateString()}</span>
              ${api.isMod() ? `<button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="deleteReview(${r.id})">🗑</button>` : ''}
            </div>
            ${r.comment ? `<div class="review-text">${r.comment}</div>` : ''}
          </div>`).join('');

        // Pagination
        if (pagination.total > 10) {
          const pages = Math.ceil(pagination.total / 10);
          let pag = '';
          for (let p = 1; p <= pages; p++) {
            pag += `<button class="page-btn ${p===reviewPage?'active':''}" onclick="reviewPage=${p};loadReviews()">${p}</button>`;
          }
          document.getElementById('reviews-pagination').innerHTML = pag;
        }
      } catch {}
    }

    async function deleteReview(reviewId) {
      const ok = await confirmModal({
        title: t('confirm_delete'),
        text: 'Atsauksme tiks dzēsta.',
        icon: '💬',
      });
      if (!ok) return;
      try {
        await api.reviews.delete(bookId, reviewId);
        showToast('Review deleted', 'success');
        loadReviews();
      } catch (e) { showToast(e.message, 'error'); }
    }

    function renderReviewForm(userReview) {
      const content = document.getElementById('review-form-content');
      if (!api.isLoggedIn()) {
        content.innerHTML = `<p class="text-muted text-sm">${t('login_required')} <a href="login.html" style="color:var(--amber)">${t('nav_login')}</a></p>`;
        return;
      }
      if (bookData?.author_id === api.getUser()?.id) {
        document.getElementById('review-form-wrap').style.display = 'none';
        return;
      }

      const existing = userReview;
      content.innerHTML = `
        <div class="form-group">
          <label class="form-label" data-i18n="your_rating">${t('your_rating')}</label>
          <div class="star-rating" id="star-rating">
            ${[1,2,3,4,5].map(i => `<span class="star ${existing?.rating >= i ? 'filled' : ''}" data-val="${i}">★</span>`).join('')}
          </div>
          <input type="hidden" id="rating-val" value="${existing?.rating || 0}">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="your_comment">${t('your_comment')}</label>
          <textarea id="review-comment" class="form-control" rows="4">${existing?.comment || ''}</textarea>
        </div>
        <button class="btn btn-primary w-full" onclick="submitReview()">${t('submit_review')}</button>
        ${existing ? `<p class="text-muted text-sm text-center mt-8">✓ Jūs jau esat atstājis atsauksmi</p>` : ''}
      `;

      // Star interaction
      const stars = document.querySelectorAll('#star-rating .star');
      stars.forEach(star => {
        star.addEventListener('click', () => {
          const val = parseInt(star.dataset.val);
          document.getElementById('rating-val').value = val;
          stars.forEach((s, i) => s.classList.toggle('filled', i < val));
        });
        star.addEventListener('mouseenter', () => {
          const val = parseInt(star.dataset.val);
          stars.forEach((s, i) => s.classList.toggle('filled', i < val));
        });
      });
      document.getElementById('star-rating').addEventListener('mouseleave', () => {
        const val = parseInt(document.getElementById('rating-val').value);
        stars.forEach((s, i) => s.classList.toggle('filled', i < val));
      });
    }

    async function submitReview() {
      const rating  = parseInt(document.getElementById('rating-val').value);
      const comment = document.getElementById('review-comment').value.trim();
      if (!rating) { showToast(t('your_rating'), 'info'); return; }
      try {
        await api.reviews.create(bookId, { rating, comment });
        showToast(t('success_review'), 'success');
        const { book } = await api.books.get(bookId);
        bookData = book;
        renderReviewForm(book.user_review);
        loadReviews();
      } catch (e) { showToast(e.message, 'error'); }
    }

    // Перерисовываем при смене языка
    const _origSet = i18n.set.bind(i18n);
    i18n.set = function(lang) {
      _origSet(lang);
      if (bookData) renderBook(bookData);
    };

    loadBook();
  </script>
</body>
</html>
