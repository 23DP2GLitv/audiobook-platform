<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AudioBooks</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/player.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      background:
        radial-gradient(ellipse 60% 60% at 30% 40%, rgba(245,158,11,0.07) 0%, transparent 60%),
        var(--bg-base);
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo a {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--amber);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 28px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--amber); }
    .auth-footer a:hover { color: var(--amber-light); }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    #error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #EF4444;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <a href="index.html">📚 AudioBooks</a>
      </div>
      <div class="auth-card">
        <h1 class="auth-title" data-i18n="login_title">Pieteikties</h1>
        <div id="error-msg"></div>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" data-i18n="email">E-pasts</label>
            <input type="email" id="email" class="form-control" data-i18n-attr="placeholder"
                   data-i18n="email" placeholder="E-pasts" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="password">Parole</label>
            <input type="password" id="password" class="form-control"
                   required>
          </div>
          <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
            <span data-i18n="login_btn">Pieteikties</span>
          </button>
        </form>
        <div class="auth-footer">
          <span data-i18n="no_account">Nav konta?</span>
          <a href="register.html" data-i18n="nav_register"> Reģistrēties</a>
        </div>
      </div>

      <div style="margin-top:16px;">
        <div class="lang-switcher" style="justify-content:center">
          <button class="lang-btn" data-lang="lv">LV</button>
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/player.js"></script>
  <script>
    i18n.init();

    // Redirect if already logged in
    if (api.isLoggedIn()) window.location.href = 'index.html';

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.lang-btn');
      if (btn) {
        i18n.set(btn.dataset.lang);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const { token, user } = await api.auth.login({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        api.setAuth(token, user);

        // Save ui_language preference
        if (user.ui_language) i18n.set(user.ui_language);

        // Redirect to intended page or home
        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
        window.location.href = redirect;
      } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `<span data-i18n="login_btn">${t('login_btn')}</span>`;
      }
    });
  </script>
</body>
</html>
